<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTC Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 320px;
            padding: 20px;
            margin: 40px auto;
            background: #c7b2ef;
            border-radius: 20px;
            text-align: center;
        }

        .container h2 {
            font-size: 24px;
            font-weight: 700;
            color: #3f2a5a;
            margin-bottom: 25px;
        }

        .card-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .card-box h4 {
            color: #555;
            font-size: 15px;
            margin: 0 0 10px;
        }

        .card-box p {
            font-size: 26px;
            font-weight: bold;
            margin: 0;
            color: #000;
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>Highest & <br> Average CTC</h2>

        <div class="card-box">
            <h4>Expected Increase in Salary Potential</h4>
            <p>60%</p>
        </div>

        <div class="card-box">
            <h4>Average CTC</h4>
            <p>₹6.1 LPA</p>
        </div>

        <div class="card-box">
            <h4>Highest CTC</h4>
            <p>₹36 LPA</p>
        </div>
    </div>

</body>
</html>
